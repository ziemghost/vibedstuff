<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jura Route Finder</title>
  <style>
    :root {
      --g0:#7d8590; --g1:#51cf66; --g2:#4dabf7; --g3:#cc5de8; --g4:#ff6b6b;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .shell { max-width: 1240px; margin: 0 auto; padding: 20px 18px 64px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 14px; }
    .top h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; }
    .top .sub { color: var(--muted); font-size: 13px; }
    .back { font-size: 13px; }

    .lang { display: inline-flex; gap: 6px; }
    .lang button {
      background: var(--control); border: 1px solid var(--control-border); border-radius: 7px;
      padding: 4px 7px; cursor: pointer; line-height: 0; opacity: .45; transition: opacity .12s ease;
    }
    .lang button[aria-pressed="true"] { opacity: 1; border-color: var(--accent); }
    .lang svg { display: block; width: 26px; height: 17px; border-radius: 2px; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
    .filters { padding: 14px; display: grid; gap: 13px; }
    .fline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    input[type=search], select {
      background: var(--control); color: var(--fg); border: 1px solid var(--control-border);
      border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 14px;
    }
    input[type=search] { flex: 1 1 240px; min-width: 0; }
    select { max-width: 240px; }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .legend { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px; }

    .range { position: relative; height: 30px; }
    .range .track { position: absolute; top: 13px; left: 0; right: 0; height: 4px; border-radius: 3px; background: var(--control-border); }
    .range .fill  { position: absolute; top: 13px; height: 4px; border-radius: 3px; background: var(--accent); }
    .range input[type=range] {
      position: absolute; top: 0; left: 0; width: 100%; height: 30px; margin: 0;
      -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
    }
    .range input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; width: 17px; height: 17px; border-radius: 50%;
      background: var(--fg); border: 3px solid var(--accent); cursor: pointer;
    }
    .range input[type=range]::-moz-range-thumb {
      pointer-events: auto; width: 17px; height: 17px; border-radius: 50%;
      background: var(--fg); border: 3px solid var(--accent); cursor: pointer;
    }
    .rvals { font-family: var(--mono); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .chip {
      background: var(--control); color: var(--muted); border: 1px solid var(--control-border);
      border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .seg { display: inline-flex; border: 1px solid var(--control-border); border-radius: 9px; overflow: hidden; }
    .seg button {
      background: var(--control); color: var(--muted); border: 0; border-right: 1px solid var(--control-border);
      padding: 9px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
    }
    .seg button:last-child { border-right: 0; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    #map { height: 420px; border-radius: 12px; overflow: hidden; margin-top: 14px; background: var(--control); }
    .maphint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
    .leaflet-popup-content { margin: 11px 13px; font-size: 13px; }
    .leaflet-container { background: #10131a; font: inherit; }
    .locbtn {
      background: var(--panel); border: 2px solid rgba(0,0,0,.25); border-radius: 6px;
      width: 34px; height: 34px; cursor: pointer; color: var(--fg); font-size: 17px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .locbtn[data-state="on"] { color: var(--accent); }
    .locbtn[data-state="wait"] { opacity: .5; }

    .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 18px 2px 9px; font-variant-numeric: tabular-nums; }
    .count b { color: var(--fg); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 720px; background: var(--panel); }
    th {
      text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
      padding: 11px 13px; border-bottom: 1px solid var(--border); background: var(--control); white-space: nowrap;
    }
    th.s { cursor: pointer; user-select: none; }
    th.s[aria-sort]:not([aria-sort="none"]) { color: var(--accent); }
    td { padding: 9px 13px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: baseline; }
    tbody tr:hover { background: var(--control); }
    .num { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .grade { font-family: var(--mono); font-weight: 600; font-size: 13px; white-space: nowrap; color: var(--gc, var(--g0)); }
    .grade::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gc, var(--g0)); margin-right: 7px; }
    .dim { color: var(--muted); font-size: 13px; }
    .style { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .tv { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
    .more { width: 100%; margin-top: 14px; }
    .empty { padding: 42px; text-align: center; color: var(--muted); }

    @media (max-width: 760px) {
      .shell { padding: 14px 12px 56px; }
      #map { height: 300px; }
      .tablewrap { border: 0; overflow-x: visible; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      table { min-width: 0; background: none; }
      tbody tr {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        padding: 11px 13px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
      }
      tbody tr:hover { background: var(--panel); }
      td { border: 0; padding: 1px 0; }
      td[data-c="grade"], td[data-c="len"] { text-align: right; }
      td[data-c="rock"], td[data-c="area"], td[data-c="meta"] { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="back" href="/vibedstuff/">← vibedstuff</a>
      <div class="lang" id="lang" role="group" aria-label="Language / Język">
        <button data-lang="pl" aria-pressed="true" title="Polski">
          <svg viewBox="0 0 30 20" aria-hidden="true">
            <rect width="30" height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#dc143c"/>
          </svg>
        </button>
        <button data-lang="en" aria-pressed="false" title="English">
          <svg viewBox="0 0 30 20" aria-hidden="true">
            <rect width="30" height="20" fill="#012169"/>
            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>
            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#C8102E" stroke-width="2"/>
            <path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/>
            <path d="M15,0 V20 M0,10 H30" stroke="#C8102E" stroke-width="3.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="top">
      <h1 data-t="title">Drogi wspinaczkowe na Jurze</h1>
      <span class="sub" id="sub"></span>
    </div>

    <div class="panel filters">
      <div class="fline">
        <input id="q" type="search" autocomplete="off" data-t-ph="search" data-t-aria="search">
        <div class="seg" id="regs" role="group"></div>
        <select id="area" aria-label="Dolina"></select>
      </div>
      <div class="fgrid">
        <div>
          <p class="legend" data-t="grade">Wycena</p>
          <div class="range" id="grange">
            <div class="track"></div><div class="fill"></div>
            <input type="range" id="g0"><input type="range" id="g1">
          </div>
          <div class="rvals" id="gvals"></div>
        </div>
        <div>
          <p class="legend" data-t="length">Długość</p>
          <div class="range" id="lrange">
            <div class="track"></div><div class="fill"></div>
            <input type="range" id="l0"><input type="range" id="l1">
          </div>
          <div class="rvals" id="lvals"></div>
        </div>
        <div>
          <p class="legend" data-t="protection">Asekuracja</p>
          <div class="fline" id="styles"></div>
        </div>
      </div>
      <div class="fline">
        <label class="switch">
          <input type="checkbox" id="tv">
          <span class="track"><span class="thumb"></span></span>
          <span data-t="traverses">Pokaż trawersy</span>
        </label>
        <button class="linkbtn" id="reset" data-t="reset">Wyczyść filtry</button>
        <span class="dim" id="pinned"></span>
      </div>
    </div>

    <div id="map"></div>
    <p class="maphint" data-t="maphint"></p>

    <p class="count" id="count"></p>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="s" data-s="name" aria-sort="none" data-t="th_route">Droga</th>
          <th class="s" data-s="grade" aria-sort="none" data-t="th_grade">Wycena</th>
          <th class="s num" data-s="len" aria-sort="none" data-t="th_length">Długość</th>
          <th class="s" data-s="rock" aria-sort="none" data-t="th_rock">Skała</th>
          <th class="s" data-s="area" aria-sort="none" data-t="th_area">Dolina</th>
          <th data-t="th_protection">Asekuracja</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <button class="btn more" id="more" hidden></button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
